name: Tool table

# Fails when README.md's tool table no longer matches what the live server lists.
# Fix: node scripts/sync-tools.mjs, then commit README.md.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node scripts/sync-tools.mjs --check
